# The macOS build, which is also the only place it is built at all: there is
# no Mac on the development machine (spec §13a).
#
# Two jobs on purpose (review #15). `build` runs the tests and makes the .dmg
# with a read-only token; `release` is the only one that can write, and it only
# runs for a tag that was pushed — a manual run on a tag builds the artifact
# and stops there.
#
# SIGNING. When the repository has the Apple secrets, the app is signed with
# the owner's Developer ID certificate and notarised through an App Store
# Connect API key, so it opens on any Mac without the Gatekeeper detour.
# Without the secrets (a fork, or before they were added) the build falls back
# to an ad-hoc signature (`-`), which still produces a working dmg that needs
# "Open Anyway" once. The secrets:
#   APPLE_CERTIFICATE           base64 of the Developer ID Application .p12
#   APPLE_CERTIFICATE_PASSWORD  its password
#   APPLE_API_KEY_P8            the App Store Connect API key (contents of the .p8)
#   APPLE_API_KEY_ID            its key id
#   APPLE_API_ISSUER            the issuer id
#   APPLE_TEAM_ID               the team id (also embedded in the certificate)
name: macOS

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    # Notarisation is a queue on Apple's side; usually minutes, occasionally an hour.
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      # `secrets` is not allowed in a step's `if`, so the decision is made here once.
      SIGNED: ${{ secrets.APPLE_CERTIFICATE != '' }}
    outputs:
      signed: ${{ env.SIGNED }}

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # The suites the development machine cannot vouch for on this platform.
      - run: npx vitest run

      - run: cargo test
        working-directory: src-tauri

      # A throwaway keychain with the Developer ID certificate. The identity name
      # is read back from the keychain rather than hard-coded, so a renewed
      # certificate keeps working as long as it is a Developer ID Application one.
      - name: Import the signing certificate
        if: env.SIGNED == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -eu
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(uuidgen)"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"
          identity="$(security find-identity -v -p codesigning "$keychain" | grep 'Developer ID Application' | head -1 | sed -E 's/.*"(.*)".*/\1/')"
          if [ -z "$identity" ]; then echo "the .p12 holds no Developer ID Application identity"; exit 1; fi
          echo "signing as $identity"
          # notarytool wants the API key as a file.
          key_path="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY_ID.p8"
          printf '%s\n' "$APPLE_API_KEY_P8" > "$key_path"
          {
            echo "APPLE_SIGNING_IDENTITY=$identity"
            echo "APPLE_API_KEY=$APPLE_API_KEY_ID"
            echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
            echo "APPLE_API_KEY_PATH=$key_path"
          } >> "$GITHUB_ENV"

      - name: Build the dmg
        env:
          # Ad-hoc (`-`) only when there is no certificate: unsigned and
          # un-notarised, so Gatekeeper asks once instead of refusing outright.
          # With a certificate, tauri signs the app, notarises and staples it
          # through the APPLE_API_* variables set above, then signs the dmg.
          # `app` is listed so the .app survives for the checks below (with
          # `dmg` alone tauri deletes it after packing).
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY || '-' }}
        run: npx tauri build --target universal-apple-darwin --bundles app dmg

      # The dmg itself gets its own ticket and staple, so Gatekeeper is happy
      # with the download even offline. Then refuse to ship anything Gatekeeper
      # would refuse: signatures verify, tickets are stapled, the policy
      # assessment passes for both the app and the dmg.
      - name: Notarise the dmg and verify everything
        if: env.SIGNED == 'true'
        run: |
          set -eu
          app="$(ls -d src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app | head -1)"
          dmg="$(ls src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg | head -1)"
          xcrun notarytool submit "$dmg" --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" --wait
          xcrun stapler staple "$dmg"
          codesign --verify --deep --strict --verbose=2 "$app"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=2 "$app"
          xcrun stapler validate "$dmg"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: plain-macos-dmg
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  release:
    needs: build
    # Only a signed dmg is attached from here. Without the secrets the dmg that
    # ships comes from `plain-macos.yml` in gregmos/pii-shield-desktop, which
    # signs with that repository's certificate; an ad-hoc one must not race it.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && needs.build.outputs.signed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: plain-macos-dmg
          path: dmg

      # The release for the tag already exists (the Windows zip is attached to
      # it); this adds the dmg beside it.
      - name: Attach the dmg to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" dmg/*.dmg --clobber --repo "${{ github.repository }}"
