# The macOS build, which is also the only place it is built at all: there is
# no Mac on the development machine (spec §13a).
#
# Two jobs on purpose (review #15). `build` runs the tests and makes the .dmg
# with a read-only token and no stored credentials; `release` is the only one
# that can write, and it only runs for a tag that was pushed — a manual run
# on a tag builds the artifact and stops there.
name: macOS

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # The suites the development machine cannot vouch for on this platform.
      - run: npx vitest run

      - run: cargo test
        working-directory: src-tauri

      - name: Build the dmg
        env:
          # Ad-hoc: unsigned and un-notarised on purpose (spec §13a). Without
          # an identity the universal binary would not be signed at all and
          # Gatekeeper would refuse it outright rather than ask.
          APPLE_SIGNING_IDENTITY: "-"
        run: npx tauri build --target universal-apple-darwin --bundles dmg

      - uses: actions/upload-artifact@v4
        with:
          name: plain-macos-dmg
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  release:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: plain-macos-dmg
          path: dmg

      # The release for the tag already exists (the Windows zip is attached to
      # it); this adds the dmg beside it.
      - name: Attach the dmg to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" dmg/*.dmg --clobber --repo "${{ github.repository }}"
