[package]
name = "plain"
version = "0.2.3"
description = "Plain — a monospace markdown reader/editor"
license = "MIT"
edition = "2021"
rust-version = "1.85"

[lib]
name = "plain_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["protocol-asset"] }
tauri-plugin-fs = "2.5"
tauri-plugin-dialog = "2.7"
tauri-plugin-opener = "2.5"
tauri-plugin-single-instance = "2.4"
tauri-plugin-window-state = "2.4"
tauri-plugin-persisted-scope = "2.3"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8.2.0"
notify-debouncer-full = "0.7.0"
tempfile = "3.27.0"
trash = "5.2.7"
encoding_rs = "0.8.35"
chardetng = "1.0.0"
blake3 = "1.8.7"
ignore = "0.4.23"
regex = "1.11.1"
rayon = "1.11.0"

# Finder tags and the quarantine flag live in extended attributes; a save
# that dropped them would quietly change what the file is (review #3).
[target.'cfg(unix)'.dependencies]
xattr = "1"

# ReplaceFileW and the HKCU file association are Windows and nothing else;
# on macOS the atomic write is `rename` and the association is in the bundle
# (spec §13a).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
winreg = "0.56.0"

[profile.release]
# Thin LTO: fat LTO with one codegen unit needs more RAM than this machine has.
lto = "thin"
strip = true
